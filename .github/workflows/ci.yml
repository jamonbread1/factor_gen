name: code-check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Import core modules
        run: python -c "from factor_gen.features import make_features; from factor_gen.evaluation import evaluate_factor; from factor_gen.search import search_combinations; print('core imports: OK')"
